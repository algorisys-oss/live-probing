name: shopwave

x-otel-env: &otel-env
  NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os,serviceinstance

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: shopwave
      POSTGRES_DB: shopwave
    ports:
      - "55432:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopwave"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "55672:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16687:16686"   # UI (host 16687 to avoid an existing Jaeger on 16686)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "24317:4317"   # OTLP gRPC (host)
      - "24318:4318"   # OTLP HTTP (host)
    # Lets the collector reach LiveProbe running on the host (T5).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      jaeger:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "packages/auth/src/index.ts"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: auth
      AUTH_PORT: "3001"
      JWT_SECRET: dev-secret-change-me
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: shopwave
      POSTGRES_DB: auth
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  cart:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "packages/cart/src/index.ts"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: cart
      CART_PORT: "3003"
      REDIS_URL: redis://redis:6379
      CATALOG_URL: http://catalog:3002
      ORDER_URL: http://order:3004
    ports:
      - "3003:3003"
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_started
      order:
        condition: service_started
      otel-collector:
        condition: service_started

  order:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "packages/order/src/index.ts"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: order
      ORDER_PORT: "3004"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: shopwave
      POSTGRES_DB: orders
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  catalog:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "packages/catalog/src/index.ts"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: catalog
      CATALOG_PORT: "3002"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: shopwave
      POSTGRES_DB: catalog
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "packages/gateway/src/index.ts"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: gateway
      GATEWAY_PORT: "3000"
      AUTH_URL: http://auth:3001
      CATALOG_URL: http://catalog:3002
      CART_URL: http://cart:3003
      ORDER_URL: http://order:3004
    ports:
      - "3000:3000"
    depends_on:
      auth:
        condition: service_started
      catalog:
        condition: service_started
      cart:
        condition: service_started
      order:
        condition: service_started
      otel-collector:
        condition: service_started

  payment-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "packages/payment-worker/src/index.ts"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: payment-worker
      PAYMENT_PORT: "3005"
      PAYMENT_DECLINE_RATE: "0.15"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: shopwave
      POSTGRES_DB: payments
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  inventory-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "packages/inventory-worker/src/index.ts"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: inventory-worker
      INVENTORY_PORT: "3006"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: shopwave
      POSTGRES_PASSWORD: shopwave
      POSTGRES_DB: inventory
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "packages/notification-worker/src/index.ts"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: notification-worker
      NOTIFICATION_PORT: "3007"
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    ports:
      - "3007:3007"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # Opt-in traffic generator: `docker compose --profile load up -d loadgen`
  loadgen:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "packages/loadgen/src/index.ts"]
    profiles: ["load"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: loadgen
      TARGET_URL: http://gateway:3000
      CONCURRENCY: "5"
      DURATION_SECONDS: "0"
      THINK_MS: "400"
    depends_on:
      gateway:
        condition: service_started

  # Storefront SPA (built and served by nginx). `docker compose --profile ui up -d frontend`
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    profiles: ["ui"]
    ports:
      - "8088:80"
    depends_on:
      gateway:
        condition: service_started

volumes:
  pgdata:
