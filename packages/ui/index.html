<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveProbe</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors lib/theme.ts.
      try {
        var t = localStorage.getItem("liveprobe-theme") === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
